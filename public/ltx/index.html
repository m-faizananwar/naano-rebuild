<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #000; color: #fff; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden; }
button { font-family: 'Manrope', system-ui, sans-serif; color: inherit; }
::selection { background: rgba(255,255,255,0.2); }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* 4. structure + layers: media 0 · hero 10 · controller 20 · header 30 · notice 40 */
.stage { position: relative; isolation: isolate; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #000; }
.media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; z-index: 0; pointer-events: none; visibility: hidden; }
.media.is-visible { visibility: visible; }
.hero { position: absolute; inset: 0; z-index: 10; pointer-events: none; }

/* 5. header */
.header {
  position: absolute; top: 0; left: 0; width: 100%; z-index: 30;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
  text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
}
.brand { display: flex; align-items: center; }
.brand a { display: inline-flex; color: #fff; }
.brand svg { height: 24px; width: auto; display: block; }
.meta { display: flex; margin-left: clamp(48px, 5vw, 70px); gap: clamp(28px, 3vw, 44px); font-size: 18px; line-height: 1.2; letter-spacing: -0.04em; }
.try {
  justify-self: end; display: inline-flex; align-items: center; justify-content: center; position: relative;
  width: 152px; height: 38px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.75);
  background: transparent; color: #fff; font-size: 18px; letter-spacing: -0.04em; text-decoration: none; text-shadow: none;
  transition: color 300ms, background-color 300ms, border-color 300ms;
}
.try:hover, .try:focus-visible { background: #fff; color: #0b1a26; border-color: #fff; }

/* 6. hero copy */
.title {
  position: absolute; top: 35.9%; left: 50%; transform: translateX(-50%); margin: 0;
  width: min(901px, calc(100vw - 48px)); text-align: center;
  font-size: clamp(62px, 6.8vw, 100px); font-weight: 500; line-height: 0.8; letter-spacing: -0.04em; white-space: nowrap;
  text-shadow: 0 2px 12px rgb(0 0 0 / 0.14);
}
.title span { display: inline-block; transition: opacity 900ms var(--retake-ease), filter 900ms var(--retake-ease), transform 900ms var(--retake-ease); }
.title span:nth-child(2) { transition-delay: 90ms; }
.title span:nth-child(3) { transition-delay: 180ms; }
.stage.title-hidden .title span { opacity: 0; filter: blur(12px); transform: translateY(-10px); }
.lede {
  position: absolute; top: calc(46.78% + 94px); left: 50%; transform: translateX(-50%); margin: 0;
  width: min(734px, calc(100vw - 48px)); text-align: center;
  font-size: clamp(14px, 1.25vw, 18px); font-weight: 400; line-height: 1.2; letter-spacing: -0.04em;
  text-shadow: 0 1px 8px rgb(0 0 0 / 0.16);
}

/* 7. controller */
.controller { position: absolute; top: 46.78%; left: 50%; transform: translateX(-50%); width: min(880px, calc(100vw - 48px)); height: 72px; z-index: 20; }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; z-index: 2; }
.cell {
  display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 14px; margin: 0;
  font-size: 23px; font-weight: 400; line-height: 1.2; letter-spacing: -0.04em; white-space: nowrap;
  background: transparent; border: 0; border-radius: 999px; cursor: pointer;
  transition: opacity 420ms var(--retake-ease), filter 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease);
}
.cell--label { cursor: default; transition: opacity 300ms var(--retake-ease), filter 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease); }
.controller.is-highlighting .cell--label { opacity: 0.5; }
.cell:disabled { cursor: default; }
.cell.is-faded { opacity: 0; filter: blur(10px); transform: scale(0.94); pointer-events: none; }
.cell.is-chosen { transform: translate(var(--dx, 0px), var(--dy, 0px)); }
.cell.is-reset { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; animation: reset-reveal 520ms var(--retake-ease) both; }
@keyframes reset-reveal { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }
.cell.is-reset-out { opacity: 0; filter: blur(10px); transition: opacity 980ms var(--retake-slow-ease), filter 980ms var(--retake-slow-ease); }
.cell.is-restoring { transition: opacity 760ms var(--retake-ease) 60ms, filter 760ms var(--retake-ease) 60ms, transform 980ms var(--retake-slow-ease); }

/* 8. glass material (verbatim) */
.glass { position: absolute; border-radius: 999px; pointer-events: none; }
.glass::before, .glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
.glass::before {
  background:
    radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%), rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),
    linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
}
.glass::after {
  padding: 1px;
  background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff, #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.track {
  top: 4px; left: 0; width: 100%; height: 64px; z-index: 0;
  background: rgb(24 55 82 / 0.31);
  border: 1px solid rgb(255 255 255 / 0.2);
  -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
          backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
  box-shadow: 0 14px 38px rgb(4 24 43 / 0.16), 0 2px 7px rgb(4 24 43 / 0.1), inset 1px 1px 0 rgb(255 255 255 / 0.48), inset -1px -1px 0 rgb(21 49 73 / 0.14), inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
  transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), opacity 400ms var(--retake-ease);
}
.track::after { opacity: 0.27; }
.capsule {
  top: -1px; height: 72px; z-index: 1;
  left: var(--cap-left, -5px); width: var(--cap-width, calc(20% + 5px));
  background: rgb(246 251 255 / 0.24);
  border: 1px solid rgb(255 255 255 / 0.28);
  -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
          backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
  box-shadow: 0 11px 28px rgb(4 24 43 / 0.17), 0 2px 6px rgb(4 24 43 / 0.1), inset 1px 1px 0 rgb(255 255 255 / 0.62), inset -1px -1px 0 rgb(20 49 73 / 0.18), inset 0 0 12px rgb(255 255 255 / 0.055);
  transition: left 620ms var(--retake-ease), width 620ms var(--retake-ease), background-color 980ms var(--retake-slow-ease), opacity 400ms var(--retake-ease);
}
.capsule::after { opacity: 0.30; }

/* 10. collapse choreography: same recalc as the fade class; the css delay does the waiting */
.controller.collapsed .capsule { left: calc(50% - 100px); width: 200px; background: rgb(246 251 255 / 0.14); transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), background-color 980ms var(--retake-slow-ease); }
.controller.collapsed .track { left: calc(50% - 96px); width: 192px; }
.controller.track-faded .track { opacity: 0; transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), opacity 400ms linear 650ms; }
.controller.expanding .capsule { transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), background-color 980ms var(--retake-slow-ease); }

/* status + notice */
.notice {
  position: absolute; z-index: 40; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: none; align-items: center; gap: 12px; padding: 10px 14px 10px 18px; border-radius: 999px;
  background: rgb(24 55 82 / 0.5); border: 1px solid rgb(255 255 255 / 0.2); font-size: 14px; letter-spacing: -0.02em;
}
.notice.is-visible { display: flex; }
.notice button { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.75); background: transparent; font-size: 14px; cursor: pointer; transition: color 300ms, background-color 300ms; }
.notice button:hover, .notice button:focus-visible { background: #fff; color: #0b1a26; }

/* 12. responsive */
@media (max-width: 900px) {
  .header { padding: calc(24px + env(safe-area-inset-top)) 24px 24px; }
  .meta { font-size: 14px; gap: 22px; margin-left: 34px; }
  .try { width: 116px; height: 36px; font-size: 14px; }
  .cell { font-size: clamp(17px, 2.5vw, 24px); }
}
@media (max-width: 700px) {
  .header { padding-left: 18px; padding-right: 18px; }
  .brand svg { height: 21px; }
  .meta { font-size: 12px; }
  .meta .meta__second { display: none; }
  .try { width: 92px; height: 34px; font-size: 13px; }
  .try::after { content: ""; position: absolute; inset: -6px -10px; }
  .title { top: 34%; width: calc(100vw - 40px); font-size: clamp(48px, 14vw, 64px); line-height: 0.88; white-space: normal; }
  .lede { top: 77%; width: calc(100vw - 44px); font-size: 14px; }
  .controller { top: 53%; width: calc(100vw - 40px); height: 156px; }
  .track { top: 0; height: 156px; border-radius: 28px; }
  .cells { grid-template-columns: 1fr 1fr; grid-template-rows: 48px 54px 54px; align-items: stretch; }
  .cell { font-size: 17px; padding: 0 8px; border-radius: 0; }
  .cell--label { grid-column: 1 / -1; border-bottom: 1px solid rgb(255 255 255 / 0.12); }
  .cell--scene, .cell--light { border-bottom: 1px solid rgb(255 255 255 / 0.12); }
  .cell--scene, .cell--colorway { border-right: 1px solid rgb(255 255 255 / 0.12); }
  .cell:active, .cell:focus-visible { outline: 2px solid rgb(255 255 255 / 0.7); outline-offset: -3px; }
  .capsule { opacity: 0; pointer-events: none; }
  /* selected: one visible glass surface, offset from the controller's own top (53dvh + 4dvh) */
  .controller.collapsed .capsule { opacity: 1; left: 50%; top: 4vh; top: 4dvh; transform: translate(-50%, -50%); width: 196px; height: 64px; border-radius: 999px; background: rgb(246 251 255 / 0.18); }
  .controller.collapsed .track { left: 0; width: 100%; }
  .cell.is-chosen { border: 0; }
}
@media (max-width: 700px) and (max-height: 700px) {
  .controller { top: 50%; }
  .lede { top: calc(50% + 168px); width: calc(100vw - 32px); font-size: 13px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .title { top: 20%; font-size: clamp(34px, 8vh, 56px); }
  .controller { top: 50%; }
  .lede { top: auto; bottom: 8px; font-size: 13px; }
}
@media (max-width: 700px) and (max-height: 520px) and (orientation: landscape) {
  .title { top: 12%; font-size: clamp(28px, 7vh, 44px); }
  .controller { top: 46%; height: 118px; }
  .track { height: 118px; }
  .cells { grid-template-rows: 36px 41px 41px; }
  .cell { font-size: 15px; }
  .lede { bottom: 6px; font-size: 12px; }
}

/* 13. reduced motion */
@media (prefers-reduced-motion: reduce) {
  .capsule, .track, .cell, .title span, .try { transition-duration: 1ms !important; transition-delay: 0s !important; }
  .cell.is-faded, .stage.title-hidden .title span, .cell.is-reset-out { filter: none; }
  .cell.is-reset { animation-duration: 1ms; }
}
</style>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var controller = document.getElementById("controller");
  var capsule = document.getElementById("capsule");
  var cellLabel = document.getElementById("cell-label");
  var buttons = Array.prototype.slice.call(document.querySelectorAll(".cell[data-scene]"));
  var status = document.getElementById("status");
  var notice = document.getElementById("notice");
  var noticeText = document.getElementById("notice-text");
  var retryBtn = document.getElementById("retry");

  // ---- media: eight persistent elements, one per clip; never remount, never swap src.
  var CLIPS = {
    scene:    { f: document.getElementById("v-scene-f"),    r: document.getElementById("v-scene-r") },
    light:    { f: document.getElementById("v-light-f"),    r: document.getElementById("v-light-r") },
    colorway: { f: document.getElementById("v-colorway-f"), r: document.getElementById("v-colorway-r") },
    fullLook: { f: document.getElementById("v-fullLook-f"), r: document.getElementById("v-fullLook-r") }
  };
  var LABELS = { scene: "Scene", light: "Lighting", colorway: "Clothing", fullLook: "Cast" };
  // terminal hold guards (seconds before duration): default 0.08, Scene reverse 0.18 — verified empirically
  function holdGuard(scene, direction) { return scene === "scene" && direction === "reverse" ? 0.18 : 0.08; }
  var FIRST_FRAME_TIMEOUT = 12000;
  var CAPSULE = ["-5px", "20%", "40%", "60%", "80%"];
  var CAPSULE_W = ["calc(20% + 5px)", "20%", "20%", "20%", "calc(20% + 5px)"];

  // state machine: scene base|scene|light|colorway|fullLook · playback · direction
  var state = { scene: "base", playback: "loading", direction: "forward" };
  var visible = null;          // the visible <video>
  var lock = false;            // synchronous playback lock
  var token = 0;               // transition token; stale async work is ignored
  var ready = {};              // clip readiness
  var lastRequest = null;      // for Retry
  var focusedIndex = null;     // keyboard focus tracking for the capsule

  function say(text) { status.textContent = text; }
  function showNotice(text) { noticeText.textContent = text; notice.classList.add("is-visible"); }
  function hideNotice() { notice.classList.remove("is-visible"); }

  function setCapsule(index) {
    capsule.style.setProperty("--cap-left", CAPSULE[index]);
    capsule.style.setProperty("--cap-width", CAPSULE_W[index]);
    controller.classList.toggle("is-highlighting", index !== 0);
  }

  function reveal(video) {
    if (visible === video) return;
    // atomic visibility switch — never a crossfade between two scene states
    video.classList.add("is-visible");
    if (visible) visible.classList.remove("is-visible");
    visible = video;
  }

  // ---- readiness: check readyState up front (cached media may never fire loadeddata) AND listen.
  function markReady(video) {
    ready[video.id] = true;
    Object.keys(CLIPS).forEach(function (scene) {
      var pair = CLIPS[scene];
      var ok = ready[pair.f.id] && ready[pair.r.id];
      var btn = document.querySelector('.cell[data-scene="' + scene + '"]');
      if (ok && state.scene === "base" && !lock) btn.disabled = false;
    });
    if (video === CLIPS.colorway.f && !visible) {
      // the base scene is video-1 parked at frame 0 as the opening visible layer
      try { video.currentTime = 0; } catch (e) {}
      video.pause();
      reveal(video);
      state.playback = "ready";
      say("Scene ready. Choose Scene, Lighting, Clothing or Cast.");
    }
  }
  Object.keys(CLIPS).forEach(function (scene) {
    [CLIPS[scene].f, CLIPS[scene].r].forEach(function (video) {
      if (video.readyState >= 2) markReady(video);
      video.addEventListener("loadeddata", function () { markReady(video); });
      video.addEventListener("error", function () { say("A clip failed to load."); });
    });
  });
  say("Loading scene…");

  // ---- seam-safe player
  function rewind(video) {
    return new Promise(function (resolve) {
      if (video.currentTime <= 0.001) { resolve(); return; }
      var done = false;
      function onSeeked() { if (done) return; done = true; video.removeEventListener("seeked", onSeeked); resolve(); }
      video.addEventListener("seeked", onSeeked);
      try { video.currentTime = 0; } catch (e) { onSeeked(); }
    });
  }

  // Resolves only when a decoded frame from THIS request is ready. With rVFC require
  // mediaTime <= 0.5 && readyState >= 2 (a stale endpoint frame carries a large
  // mediaTime). Without rVFC: readiness + playing + double rAF. A timeout never counts.
  function firstFrame(video, myToken) {
    return new Promise(function (resolve, reject) {
      var settled = false, timer = null, remaining = FIRST_FRAME_TIMEOUT, started = Date.now();
      var rvfcId = null, rafId = null;
      function cleanup() {
        if (timer) clearTimeout(timer);
        if (rvfcId !== null && video.cancelVideoFrameCallback) video.cancelVideoFrameCallback(rvfcId);
        if (rafId !== null) cancelAnimationFrame(rafId);
        document.removeEventListener("visibilitychange", onVis);
        video.removeEventListener("playing", onPlaying);
      }
      function ok() { if (settled) return; settled = true; cleanup(); resolve(); }
      function fail(why) { if (settled) return; settled = true; cleanup(); reject(new Error(why)); }
      function startTimer() { started = Date.now(); timer = setTimeout(function () { fail("first frame timeout"); }, remaining); }
      function stopTimer() { if (timer) clearTimeout(timer); timer = null; remaining -= Date.now() - started; if (remaining < 0) remaining = 0; }
      // pause the deadline while hidden: frame callbacks freeze in a background tab
      function onVis() {
        if (document.hidden) { stopTimer(); video.pause(); try { video.currentTime = 0; } catch (e) {} }
        else { startTimer(); if (myToken === token) video.play().catch(function () {}); }
      }
      function onPlaying() {
        if (video.requestVideoFrameCallback) return;
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          if (myToken !== token) return;
          if (video.readyState >= 2 && !video.paused) ok();
        }); });
      }
      document.addEventListener("visibilitychange", onVis);
      if (video.requestVideoFrameCallback) {
        var tick = function (now, meta) {
          if (settled || myToken !== token) return;
          if (meta.mediaTime <= 0.5 && video.readyState >= 2) { ok(); return; }
          rvfcId = video.requestVideoFrameCallback(tick);
        };
        rvfcId = video.requestVideoFrameCallback(tick);
      } else {
        video.addEventListener("playing", onPlaying);
      }
      if (!document.hidden) startTimer(); else remaining = FIRST_FRAME_TIMEOUT;
    });
  }

  // Monitor only the active video near its hold time; pause on the terminal frame.
  function holdAtEnd(video, guard, myToken) {
    return new Promise(function (resolve) {
      var done = false, rafId = null;
      function finish() {
        if (done) return; done = true;
        video.removeEventListener("ended", onEnded);
        if (rafId !== null) cancelAnimationFrame(rafId);
        video.pause();
        resolve();
      }
      function onEnded() { finish(); } // fallback only, never relied on alone
      function loop() {
        if (myToken !== token) return;
        var d = video.duration;
        if (d && video.currentTime >= d - guard) { finish(); return; }
        rafId = requestAnimationFrame(loop);
      }
      video.addEventListener("ended", onEnded);
      rafId = requestAnimationFrame(loop);
    });
  }

  function playClip(video, scene, direction, myToken) {
    return rewind(video).then(function () {
      if (myToken !== token) throw new Error("stale");
      // register the first-frame callback BEFORE play(); reject the chain on play() rejection
      var framePromise = firstFrame(video, myToken);
      var playPromise = video.play();
      return Promise.all([playPromise, framePromise]);
    }).then(function () {
      if (myToken !== token) throw new Error("stale");
      reveal(video);
      state.playback = "playing";
      return holdAtEnd(video, holdGuard(scene, direction), myToken);
    });
  }

  // ---- choreography
  function chosenButton(scene) { return document.querySelector('.cell[data-scene="' + scene + '"]'); }
  function setDisabled(all) {
    buttons.forEach(function (b) { b.disabled = all; });
  }
  function hideOthers(scene) {
    buttons.forEach(function (b) {
      if (b.dataset.scene === scene) return;
      b.classList.add("is-faded"); b.setAttribute("aria-hidden", "true"); b.setAttribute("tabindex", "-1");
    });
    cellLabel.classList.add("is-faded");
  }
  function travelToCapsule(btn) {
    // measure the label against the capsule's target centre (collapsed geometry)
    var c = controller.getBoundingClientRect();
    var b = btn.getBoundingClientRect();
    var isMobile = window.matchMedia("(max-width: 700px)").matches;
    var targetX, targetY;
    if (isMobile) { targetX = c.left + c.width / 2; targetY = c.top + (window.innerHeight * 0.04); }
    else { targetX = c.left + c.width / 2; targetY = c.top - 1 + 36; }
    btn.style.setProperty("--dx", (targetX - (b.left + b.width / 2)).toFixed(1) + "px");
    btn.style.setProperty("--dy", (targetY - (b.top + b.height / 2)).toFixed(1) + "px");
    btn.classList.add("is-chosen");
  }
  function titleHideLater(video) {
    var d = video.duration || 2;
    var wait = Math.min(d * 0.12, 0.9) * 1000;
    setTimeout(function () { stage.classList.add("title-hidden"); }, wait);
  }

  function forward(scene) {
    if (lock || state.scene !== "base" || state.playback === "loading") return;
    var pair = CLIPS[scene];
    if (!ready[pair.f.id] || !ready[pair.r.id]) return;
    lock = true; var myToken = ++token; hideNotice();
    setDisabled(true);
    var btn = chosenButton(scene);
    var hadFocus = document.activeElement === btn;
    lastRequest = { scene: scene, direction: "forward" };
    state.direction = "forward"; state.playback = "starting";
    say("Switching " + LABELS[scene] + "…");
    // collapse + rear fade in the SAME recalc; the css 650ms delay does the waiting
    hideOthers(scene);
    travelToCapsule(btn);
    controller.classList.remove("expanding");
    controller.classList.add("collapsed", "track-faded");
    titleHideLater(pair.f);
    playClip(pair.f, scene, "forward", myToken).then(function () {
      if (myToken !== token) return;
      state.scene = scene; state.playback = "ready";
      btn.textContent = "Reset"; btn.classList.add("is-reset"); btn.setAttribute("aria-label", "Reset to base scene");
      btn.disabled = false;
      if (hadFocus) btn.focus({ preventScroll: true });
      lock = false;
      say(LABELS[scene] + " selected. Reset returns to the base scene.");
    }).catch(function (err) {
      if (myToken !== token) return;
      failTransition(err, scene, btn, hadFocus);
    });
  }

  function reverse(scene) {
    if (lock || state.scene !== scene) return;
    var pair = CLIPS[scene];
    lock = true; var myToken = ++token; hideNotice();
    var btn = chosenButton(scene);
    var hadFocus = document.activeElement === btn;
    setDisabled(true);
    lastRequest = { scene: scene, direction: "reverse" };
    state.direction = "reverse"; state.playback = "starting";
    say("Resetting…");
    // start the reverse clip AND expand the bar in parallel
    btn.classList.remove("is-reset"); btn.classList.add("is-reset-out");
    controller.classList.add("expanding");
    controller.classList.remove("collapsed", "track-faded");
    setCapsule(0);
    buttons.forEach(function (b) { if (b !== btn) { b.classList.add("is-restoring"); b.classList.remove("is-faded"); } });
    cellLabel.classList.add("is-restoring"); cellLabel.classList.remove("is-faded");
    playClip(pair.r, scene, "reverse", myToken).then(function () {
      if (myToken !== token) return;
      commitBase(btn, scene, hadFocus);
      say("Base scene.");
    }).catch(function (err) {
      if (myToken !== token) return;
      failTransition(err, scene, btn, hadFocus);
    });
  }

  function commitBase(btn, scene, hadFocus) {
    state.scene = "base"; state.playback = "ready";
    btn.textContent = LABELS[scene]; btn.removeAttribute("aria-label");
    btn.classList.remove("is-reset-out", "is-chosen"); btn.style.removeProperty("--dx"); btn.style.removeProperty("--dy");
    buttons.forEach(function (b) { b.classList.remove("is-restoring", "is-faded"); b.removeAttribute("aria-hidden"); b.removeAttribute("tabindex"); b.disabled = !(ready[CLIPS[b.dataset.scene].f.id] && ready[CLIPS[b.dataset.scene].r.id]); });
    cellLabel.classList.remove("is-restoring", "is-faded");
    controller.classList.remove("expanding");
    stage.classList.remove("title-hidden");
    if (hadFocus) btn.focus({ preventScroll: true });
    lock = false;
  }

  function failTransition(err, scene, btn, hadFocus) {
    // preserve the last valid frame; announce; offer Retry; never claim completion
    state.playback = "error";
    if (state.direction === "forward") {
      // reopen the bar so nothing is stranded
      controller.classList.add("expanding");
      controller.classList.remove("collapsed", "track-faded");
      setCapsule(0);
      buttons.forEach(function (b) { b.classList.remove("is-faded"); b.removeAttribute("aria-hidden"); b.removeAttribute("tabindex"); });
      cellLabel.classList.remove("is-faded");
      btn.classList.remove("is-chosen"); btn.style.removeProperty("--dx"); btn.style.removeProperty("--dy");
      stage.classList.remove("title-hidden");
      buttons.forEach(function (b) { b.disabled = false; });
    } else {
      btn.classList.remove("is-reset-out"); btn.classList.add("is-reset");
      controller.classList.remove("expanding"); controller.classList.add("collapsed", "track-faded");
      btn.disabled = false;
    }
    lock = false;
    if (hadFocus) btn.focus({ preventScroll: true });
    say("The transition could not start. " + (err && err.message ? err.message : ""));
    showNotice("The transition could not start.");
  }

  retryBtn.addEventListener("click", function () {
    if (!lastRequest) return;
    hideNotice();
    if (lastRequest.direction === "forward") forward(lastRequest.scene); else reverse(lastRequest.scene);
  });

  // ---- controller interaction
  buttons.forEach(function (btn) {
    var index = Number(btn.dataset.index);
    btn.addEventListener("click", function () {
      var scene = btn.dataset.scene;
      if (state.scene === "base") forward(scene);
      else if (state.scene === scene) reverse(scene);
      // another control while a branch is selected does nothing
    });
    btn.addEventListener("pointerenter", function () { if (state.scene === "base" && !lock) setCapsule(index); });
    btn.addEventListener("focus", function () { focusedIndex = index; if (state.scene === "base" && !lock) setCapsule(index); });
    btn.addEventListener("blur", function () { if (focusedIndex === index) focusedIndex = null; if (state.scene === "base" && !lock && !controller.matches(":hover")) setCapsule(0); });
  });
  controller.addEventListener("pointerleave", function () {
    if (state.scene !== "base" || lock) return;
    if (focusedIndex !== null && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.index) return;
    setCapsule(0);
  });
  // highlight origin follows the pointer via custom properties — no layout, no re-render
  controller.addEventListener("pointermove", function (e) {
    var r = controller.getBoundingClientRect();
    controller.style.setProperty("--glass-x", ((e.clientX - r.left) / r.width * 100).toFixed(1) + "%");
    controller.style.setProperty("--glass-y", ((e.clientY - r.top) / r.height * 100).toFixed(1) + "%");
  });
  setCapsule(0);
})();
</script>
</body>
</html>
